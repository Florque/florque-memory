# Only needed for the optional Neo4j backend (MEMORY_BACKEND=neo4j). Ladybug, the default, is embedded.
services:
  neo4j:
    image: neo4j:5-community
    container_name: memory-engine-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/memory-engine-dev
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p memory-engine-dev 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  neo4j-data:
